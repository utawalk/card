<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード一覧 — Card Games</title>
  <meta name="description" content="ゲームで使われているトランプの表面デザインと、揃えると完成する絵を4スート × 13枚 + 完成絵で一覧表示します。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <!-- 浮遊スーツの背景 -->
  <div id="ambient-layer" aria-hidden="true"></div>

  <div id="lobby-container" class="deck-page">

    <!-- ヘッダー -->
    <header class="deck-header">
      <a href="lobby.html" class="deck-back-btn" id="back-to-lobby-btn">
        <span class="deck-back-arrow">←</span>
        <span>ロビーへ戻る</span>
      </a>
      <div class="deck-title-wrap">
        <h1 class="deck-page-title">🎴 Playing Cards</h1>
        <p class="deck-page-sub">4 Suits &times; 13 Cards + Complete Art</p>
      </div>
      <!-- スーツジャンプリンク -->
      <nav class="deck-suit-nav" aria-label="スーツジャンプ">
        <a href="#suit-spades"   class="deck-suit-btn spade"   id="nav-spades"   title="Spades">♠</a>
        <a href="#suit-hearts"   class="deck-suit-btn heart"   id="nav-hearts"   title="Hearts">♥</a>
        <a href="#suit-clubs"    class="deck-suit-btn club"    id="nav-clubs"    title="Clubs">♣</a>
        <a href="#suit-diamonds" class="deck-suit-btn diamond" id="nav-diamonds" title="Diamonds">♦</a>
      </nav>
    </header>

    <!-- カード一覧 -->
    <main class="deck-main" id="deck-main">
      <!-- JS で動的生成 -->
    </main>

    <!-- フッター -->
    <footer class="lobby-footer">
      <p>♠ ♥ ♣ ♦ &nbsp; Card Games Collection &nbsp; ♠ ♥ ♣ ♦</p>
    </footer>

  </div>

  <!-- 拡大モーダル -->
  <div id="deck-modal" class="deck-modal-overlay" aria-hidden="true" role="dialog" aria-label="カード拡大表示">
    <div class="deck-modal-box" id="deck-modal-box">
      <!-- ナビゲーション矢印 -->
      <button class="deck-modal-nav deck-modal-prev" id="deck-modal-prev" aria-label="前のカード">‹</button>
      <button class="deck-modal-nav deck-modal-next" id="deck-modal-next" aria-label="次のカード">›</button>

      <!-- 閉じるボタン -->
      <button class="deck-modal-close" id="deck-modal-close" aria-label="閉じる">✕</button>

      <!-- カード画像 -->
      <div class="deck-modal-img-wrap">
        <img class="deck-modal-img" id="deck-modal-img" src="" alt="">
      </div>

      <!-- 情報 -->
      <div class="deck-modal-info">
        <span class="deck-modal-suit" id="deck-modal-suit"></span>
        <span class="deck-modal-rank" id="deck-modal-rank"></span>
      </div>

      <!-- カウンター -->
      <div class="deck-modal-counter" id="deck-modal-counter"></div>
    </div>
  </div>

  <script src="js/cards.js"></script>
  <script src="deck.js"></script>
</body>
</html>
